<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Devclub - Convert Money</title>
</head>

<body>
    <img src="./assets/logo.gif" alt="logo-devclub-convert-money" class="logo">
    <main>
        <label for="moedaOrigem">Converter <b>de:</b>
            <select name="moeda" id="moedaOrigem">
                <option value="real">R$ Real</option>
                <!-- <option value="dolar">US$ Dólar</option>
            <option value="euro">€ Euro</option>
            <option value="libra">£ Libra</option>
            <option value="iene">¥ Iene</option>
            <option value="bitcoin">BTC Bitcoin</option> -->
            </select>
        </label>

        <label for="moedaDestino">Converter <b>para:</b>
            <select name="moeda" id="moedaDestino" class="selectCurrencyToConvert">
                <!-- <option value="real">R$ Real</option> -->
                <option value="dolar">US$ Dólar</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra</option>
                <option value="iene">¥ Iene</option>
                <option value="bitcoin">BTC Bitcoin</option>
            </select>
        </label>


        <label for="valor">Valor:
            <input type="number" placeholder="R$ 10.000,00" class="inputCurrencyValue" step="0.01" min="0">
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div class="currency-box">
                <img src="./assets/real.png" alt="logo moeda a converter">
                <p class="currency-name">Real</p>
                <h3 class="currency-value-to-convert">R$ 0,00</h3>
            </div>

            <img src="./assets/arrow.png" alt="seta" class="arrow-img">

            <div class="currency-box">
                <img src="./assets/dolar.png" alt="logo moeda convertida" class="cvcImage">
                <p class="currency-name cvcName">Dólar</p>
                <h3 class="currency-value-converted">US$ 0,00</h3>
            </div>

        </section>
    </main>
</body>
<script src="./script.js"></script>

</html>
